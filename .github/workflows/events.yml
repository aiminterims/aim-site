name: Обновить мероприятия на сайте
on:
  push:
    paths: ['data/events.xlsx', 'tools/build_events.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl beautifulsoup4
      - run: python tools/build_events.py
      - name: Пересобрать языковые версии
        run: python tools/build_i18n.py
      - name: Сохранить изменения
        run: |
          git config user.name "aim-site-bot"
          git config user.email "bot@aim-interims.ru"
          git add -A index.html school products en kk uz hy az sitemap.xml
          git diff --cached --quiet || (git commit -m "Мероприятия обновлены из таблицы" && git pull --rebase && git push)
